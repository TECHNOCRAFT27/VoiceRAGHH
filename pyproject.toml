[project]
name = "voiceraghh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vedant khopade", email = "pramilakhopde94597@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.115.0",
    "fastembed>=0.8.0",
    "faster-whisper>=1.2.1",
    "groq>=1.6.0",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34.0",
]

[project.scripts]
voiceraghh = "voiceraghh:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
